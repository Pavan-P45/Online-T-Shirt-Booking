<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <h2>Admin Dashboard</h2>
  <button id="logoutBtn">Logout</button>

  <!-- Add Product Section -->
  <section>
    <h3>Add T-Shirt</h3>
    <form id="addForm">
      <input id="pname" placeholder="Name" required /><br>
      <input id="pprice" placeholder="Price" type="number" required /><br>
      <input id="pimage" placeholder="Image URL" /><br>
      <textarea id="pdesc" placeholder="Description"></textarea><br>
      <button type="submit">Add Product</button>
    </form>
    <div id="addMsg"></div>
  </section>

  <!-- Products List -->
  <section>
    <h3>Products</h3>
    <div id="products"></div>
  </section>

  <!-- Orders List -->
  <section>
    <h3>Orders</h3>
    <div id="orders"></div>
  </section>

<script>
  // --- Fetch Products ---
  async function fetchProducts() {
    const res = await fetch('/api/products');
    const products = await res.json();
    const container = document.getElementById('products');
    container.innerHTML = '';
    products.forEach(p => {
      container.innerHTML += `
        <div class="product-card">
          <h4>${p.name}</h4>
          <p>₹${p.price}</p>
          ${p.image ? `<img src="${p.image}" alt="${p.name}" style="max-width:100px;">` : ''}
          <p>${p.description || ''}</p>
          <button onclick="deleteProduct('${p._id}')">Delete Product</button>
          <hr>
        </div>
      `;
    });
  }

  // --- Fetch Orders ---
  async function fetchOrders() {
    const res = await fetch('/api/admin/orders');
    if (!res.ok) { 
      document.getElementById('orders').innerText = 'Not authorized or error';
      return; 
    }
    const orders = await res.json();
    const container = document.getElementById('orders');
    container.innerHTML = '';
    orders.forEach(o => {
      const items = o.items.map(it => `<li>${it.name} x ${it.qty}</li>`).join('');
      container.innerHTML += `
        <div class="order-card">
          <p><strong>${o.name}</strong> — ${o.contact}</p>
          <p>${o.address}</p>
          <p>Total: ₹${o.total}</p>
          <ul>${items}</ul>
          <button onclick="deleteOrder('${o._id}')">Delete Order</button>
          <hr>
        </div>
      `;
    });
  }

  // --- Add Product ---
  document.getElementById('addForm').onsubmit = async (e) => {
    e.preventDefault();
    const body = {
      name: document.getElementById('pname').value,
      price: document.getElementById('pprice').value,
      image: document.getElementById('pimage').value,
      description: document.getElementById('pdesc').value
    };
    const res = await fetch('/api/admin/products', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('addMsg').innerText = 'Product added';
      document.getElementById('addForm').reset();
      fetchProducts(); // refresh products list
    } else {
      document.getElementById('addMsg').innerText = data.message || 'Error';
    }
  };

  // --- Logout ---
  document.getElementById('logoutBtn').onclick = async () => {
    await fetch('/api/admin/logout', { method: 'POST' });
    location.href = '/';
  };

  // --- Delete Product ---
  async function deleteProduct(productId) {
    if (confirm('Are you sure you want to delete this product?')) {
      const res = await fetch(`/api/admin/products/${productId}`, { method: 'DELETE' });
      const data = await res.json();
      alert(data.message);
      fetchProducts();
    }
  }

  // --- Delete Order ---
  async function deleteOrder(orderId) {
    if (confirm('Are you sure you want to delete this order?')) {
      const res = await fetch(`/api/admin/orders/${orderId}`, { method: 'DELETE' });
      const data = await res.json();
      alert(data.message);
      fetchOrders();
    }
  }

  // --- Load Data on Page Load ---
  fetchProducts();
  fetchOrders();
</script>
</body>
</html>
